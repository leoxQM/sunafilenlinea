<div class="w-full h-full relative">
    <div class="w-10 xl:w-9 containerBody mx-auto pb-7">
        <div class="text-center xl:text-left pt-4 xl:pt-6 pb-5">
            <h2 class="color-titulo text-4xl">Consultas y trámites</h2>
            <p class="w-1 mx-auto xl:ml-0 mt-0 bg-lineaRoja"></p>
        </div>
        <div class="grid grid-container" [@aparecerAnimacion]>
            <!-- MOSTRAR SERVICIOS CON DATA EN DURO
            <a *ngFor="let item of filteredDataServicios" [href]="'https://'+item.url" target="_blank" [pTooltip]="item.tooltip" tooltipPosition="top" class="col-6 md:col-3 xl:col-2 cajitaAnimacion">
                <div class="text-center p-3 margenCajita border-round-sm bg-white font-bold">
                    <img [src]="'assets/img/SunafilEnLineaImg/APLICACIONES/'+item.icono+'.svg'" class="w-6" alt="">
                    <h6 class="color-titulo font-bold text-center mt-2">{{ item.nombreServicioEmpleador }}</h6>
                </div>
            </a> -->
            <a *ngFor="let item of filteredDataServicios" [href]="item.enlaceURL" target="_blank" [pTooltip]="item.mensaje" tooltipPosition="top" class="col-6 md:col-3 xl:col-2 cajitaAnimacion">
                <div class="text-center p-3 margenCajita border-round-sm bg-white font-bold">
                    <img [src]="'assets/img/aplicaciones/'+item.enlaceLogo.toLowerCase()" class="w-6" alt="">
                    <h6 class="color-titulo font-bold text-center px-2 mt-2">{{ item.descripcion }}</h6>
                </div>
            </a>
            <ng-container *ngIf="this.filteredDataServicios.length==0">
                <div class="text-center p-7">
                    <h1 class="color-titulo">Lo sentimos, no se encontraron resultados.</h1>
                </div>
            </ng-container>
        </div>
    </div>
        <a class="containerAyuda mb-6 cursor-pointer" href="https://aplicativosweb2.sunafil.gob.pe/si.sugerencias/inicio" target="_blank">
            <img src="assets/img/btn-ayuda.svg" class=" containerBtnAyuda" alt="">
            <p class="text-white bg-blue-600">  Envía tus sugerencias  </p>
        </a>
</div>
